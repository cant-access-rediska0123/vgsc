hydra:
  run:
    dir: /cluster/project/sachan/ekaterina/data/astar_decoding/${now:%Y-%m-%d}/${now:%H-%M-%S}

defaults:
  - model: qwen2.5_math_7b_instruct
  - dataset: math_500
  - _self_

system:
  device: "cuda:0"
  seed: 42
  hf_cache: "/cluster/project/sachan/ekaterina/.cache"
  torch_dtype: "bfloat16"

scorer:
  type: chain_majority_voting
  answer_extraction_patterns:
    - "Answer:\\s*(.+?)(?:\\n|\\.|\\$)"
    - "The answer is\\s*(.+?)(?:\\n|\\.|\\$)"
    - "Therefore,?\\s*(.+?)(?:\\n|\\.|\\$)"
    - "<Answer>:\\s*(.+?)(?:\\n|$)"

verbose: true

generation:
  max_new_tokens: 4096
  temperature: 1.0
  top_p: 0.8
  top_k: 20
  batch_size: 1
  max_length: 4096

strategy:
  type: self_consistency
  num_paths: 5  # Number of reasoning paths (generated in single vLLM call)

evaluation:
  evaluators:
    - exact_match
