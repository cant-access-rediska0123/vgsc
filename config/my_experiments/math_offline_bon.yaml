hydra:
  run:
    dir: /cluster/project/sachan/ekaterina/data/astar_decoding/${now:%Y-%m-%d}/${now:%H-%M-%S}

defaults:
  - model: qwen2.5_math_7b_instruct
  - dataset: math_500
  - _self_

system:
  device: "cuda:0"
  seed: 42
  hf_cache: "/cluster/project/sachan/ekaterina/.cache"
  torch_dtype: "float16"

verbose: true

generation:
  max_new_tokens: 4096
  temperature: 1.0
  top_p: 0.8
  top_k: 20
  batch_size: 1
  max_length: 4096

strategy:
  type: offline_best_of_n
  num_trajectories: 5
  max_steps: 50
  score_aggregation: min  # Conservative: trajectory is only as good as its weakest step
  batch_generation: true  # Fully batched: M×N trajectories in single vLLM call
  # Stop tokens derived from detector config (use_* flags below)
  stop_token_ids:
    - 151645  # <|im_end|>
    - 151643  # <|endoftext|>
  # Step boundary token limits
  min_step_tokens: 10
  max_step_tokens: 2048
  # Marker categories (ThinkingMarkerDetector derives stop tokens from these)
  use_sequence: true
  use_conclusion: true
  use_thinking: true
  use_verification: true
  use_structure: false  # Disabled to avoid splitting on bullet points and paragraph breaks
  use_reasoning: true
  use_correction: false
  # Custom words for stop tokens
  custom_words:
    - "for example"
    - "given that"
    - "similarly"
    - "step"
    - "therefore"
    - "thus"

# PRM scorer configuration
scorer:
  type: prm
  model_path: "Qwen/Qwen2.5-Math-PRM-7B"
  batch_size: 1
  device: cuda:1

evaluation:
  evaluators:
    - exact_match
