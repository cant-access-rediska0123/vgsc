defaults:
  - model: qwen2.5_math_1.5b_instruct
  - dataset: gsm8k_500
  - _self_

system:
  device: "cuda:0"
  seed: 42
  torch_dtype: "float16"

verbose: true

generation:
  max_new_tokens: 4096
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  batch_size: 1
  max_length: 4096
  repetition_penalty: 1.2

strategy:
  type: verifier_guided_self_consistency
  num_paths: 5              # Number of top beams to keep at each step
  candidates_per_step: 3    # Number of candidates to generate per beam
  max_steps: 20             # Maximum reasoning steps
  aggregation: "product_correctness"         # How to aggregate scores: mean, sum, min, max, product
  batch_generation: true    # Process ALL samples in parallel (one vLLM call per step)
  # Stop tokens derived from detector config
  stop_token_ids:
    - 151645  # <|im_end|>
    - 151643  # <|endoftext|>
  # Step boundary token limits
  min_step_tokens: 10
  max_step_tokens: 2048
  # Marker categories (ThinkingMarkerDetector derives stop tokens from these)
  use_sequence: true
  use_conclusion: true
  use_thinking: true
  use_verification: true
  use_structure: true
  use_reasoning: true
  use_correction: false
  # Custom words for stop tokens
  custom_words:
    - "for example"
    - "given that"
    - "similarly"
    - "step"
    - "therefore"
    - "thus"
    - "\n\n"

# PRM scorer configuration
scorer:
  type: uhead
  batch_size: 1
  hs_device: cuda:1
  gpu_memory_utilization: 0.4
  device: cuda:1

# PRM scorer configuration
scorer_heuristic:
  type: uhead
  batch_size: 1
  hs_device: cuda:2
  gpu_memory_utilization: 0.4
  device: cuda:2

evaluation:
  evaluators:
    - exact_match
