hydra:
  run:
    dir: /cluster/project/sachan/ekaterina/data/astar_decoding/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}

defaults:
  - model: qwen2.5_math_1.5b_instruct
  - dataset: gsm8k_500
  - _self_

system:
  device: "cuda:0"
  seed: 42
  hf_cache: "/cluster/project/sachan/ekaterina/.cache"
  torch_dtype: "float16"

verbose: true

generation:
  max_new_tokens: 4096
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  batch_size: 1
  max_length: 4096
  repetition_penalty: 1.2

strategy:
  type: weighted_self_consistency
  num_paths: 10
  max_steps: 20
  agg: product_correctness
  stop_token_ids:
    - 151645  # <|im_end|>
    - 151643  # <|endoftext|>
  # Step boundary token limits
  min_step_tokens: 10
  max_step_tokens: 2048
  # Marker categories (ThinkingMarkerDetector derives stop tokens from these)
  use_sequence: true
  use_conclusion: true
  use_thinking: true
  use_verification: true
  use_structure: true
  use_reasoning: true
  use_correction: false
  # Custom words for stop tokens
  custom_words:
    - "for example"
    - "given that"
    - "similarly"
    - "step"
    - "therefore"
    - "thus"
    - "\n\n"

# PRM scorer configuration
scorer:
  type: uhead
  model_path: "rediska0123/qwen25-math-uhead-correctness-10epochs"
  batch_size: 1
  hs_device: cuda:1
  gpu_memory_utilization: 0.4
  device: cuda:1

evaluation:
  evaluators:
    - exact_match
