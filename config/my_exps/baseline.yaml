defaults:
  - model: qwen2.5_math_1.5b_instruct
  - dataset: gsm8k_500
  - _self_

system:
  device: "cuda:0"
  seed: 42
  torch_dtype: "bfloat16"

strategy:
  type: baseline
  max_new_tokens: 4096
  temperature: 0.0

scorer: null
verbose: true

generation:
  max_new_tokens: 4096
  temperature: 0.0
  top_p: 0.8
  top_k: 20
  batch_size: 1
  max_length: 4096

evaluation:
  evaluators:
    - exact_match