model_name_or_path: Qwen/Qwen2.5-Math-7B-Instruct

dataset_split: train
dataset_name: rediska0123/math-from-prm800k
max_questions: 1000
offset: 0
system_prompt: "Please reason step by step, and put your final answer within \\boxed{}."

output_path: /cluster/project/sachan/ekaterina/data/astar_decoding/train-qwen2.5math7binstruct-texts
hf_output_path: rediska0123/train-qwen2.5math7binstruct-texts

num_samples_per_question: 3
enable_step_continuations: true
continuations_per_step: 10

tensor_parallel_size: 1
gpu_memory_utilization: 0.9
trust_remote_code: true
enforce_eager: false
seed: 42

strategy:
  # Stop tokens derived from detector config
  stop_token_ids:
    - 151645  # <|im_end|>
    - 151643  # <|endoftext|>
    - 144236  # 😊
    - 145354  # 🌈
    - 145973  # 🤑
    - 144904  # 👇
  # Step boundary token limits
  min_step_tokens: 10
  max_step_tokens: 2048
  # Marker categories (ThinkingMarkerDetector derives stop tokens from these)
  use_sequence: true
  use_conclusion: true
  use_thinking: true
  use_verification: true
  use_structure: true
  use_reasoning: true
  use_correction: false
  # Custom words for stop tokens
  custom_words:
    - "for example"
    - "given that"
    - "similarly"
    - "step"
    - "therefore"
    - "thus"
    - "\n\n"

generation:
  max_new_tokens: 4096
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  max_length: 4096
  repetition_penalty: 1.2
